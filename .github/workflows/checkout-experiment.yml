      - name: Checkout aoa-session-memory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-session-memory
          ref: b04c6101b66040b16edc5cdf39b2621aef20765c
          path: .deps/aoa-session-memory
          fetch-depth: 0
          filter: ${{ matrix.filter }}
          ssh-key: ${{ secrets.AOA_SESSION_MEMORY_DEPLOY_KEY }}
          persist-credentials: false

      - name: Checkout public providers in bounded parallel wave
        if: matrix.strategy == 'parallel-git'
        run: |
          python - <<'PY'
          import concurrent.futures
          import subprocess
          from pathlib import Path

          repositories = [
              ('Agents-of-Abyss', '66d86b04e685cf06b03a95a3f9c74e7c8d607740'),
              ('Tree-of-Sophia', 'd95a583272acb84dcb5b7e6896801f0364c7b234'),
              ('8Dionysus', 'aa67908a137a9c9631a439f266d32a8918c7213c'),
              ('aoa-memo', 'c7c83081b7db0a0e908f14888b7438b5ecdde3bf'),
              ('aoa-playbooks', 'b72ca2d333bcdf516ed6656e34670fa93df88162'),
              ('aoa-evals', '58bf49d374b008ef6625a9fd6893c61096777b4d'),
              ('aoa-agents', '92dd79e6c79fef60faedf6b97f2c65ff89477d06'),
              ('aoa-techniques', '9a5222cc6a6b1fdc52b4df906f49dadfd0383c71'),
              ('aoa-sdk', 'cbf225627f9f28d0470deb8a962ae12d1fe72375'),
              ('aoa-skills', '5929ad000ff06750ced1c806766138dc11e54e5a'),
              ('aoa-stats', '5627c41efe9f766a4b3437da857060847cb4f0f1'),
              ('abyss-stack', '017210fa2b9b4ba10fe7c3c00ee8d3e63b926298'),
              ('abyss-machine', 'a70b7f3a029c2dc4e86aa7446e4a058aa9e2e83e'),
              ('aoa-4pda-connector', 'a273f71c6fcc30c34759b2ef1e2f08cd8fc6baa3'),
              ('aoa-course-connector', '5a5219ef027df029313fc527c71a8764cfbd193e'),
              ('aoa-discord-connector', '2652b1d657cbe5a7888ac979cc07a8f9ec792887'),
              ('aoa-stackoverflow-connector', 'a239551bd629f59d32b59649eb308245be99c903'),
              ('aoa-telegram-connector', '1d7e4157446839dc03f3ec80b687fdbb12dd8a22'),
              ('aoa-xda-connector', '45dc97667c104f17b71fcd13978de5172e5c4c8d'),
          ]

          def checkout(item):
              repository, pin = item
              destination = Path('.deps') / repository
              destination.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(['git', 'init', '--quiet', str(destination)], check=True)
              subprocess.run(
                  ['git', '-C', str(destination), 'remote', 'add', 'origin',
                   f'https://github.com/8Dionysus/{repository}.git'],
                  check=True,
              )
              subprocess.run(
                  [
                      'git', '-C', str(destination), '-c', 'protocol.version=2',
                      'fetch', '--no-tags', '--prune', '--no-recurse-submodules',
                      'origin', '+refs/heads/*:refs/remotes/origin/*',
                      '+refs/tags/*:refs/tags/*',
                  ],
                  check=True,
              )
              subprocess.run(
                  ['git', '-C', str(destination), 'checkout', '--quiet', '--detach', pin],
                  check=True,
              )
              observed = subprocess.check_output(
                  ['git', '-C', str(destination), 'rev-parse', 'HEAD'], text=True
              ).strip()
              if observed != pin:
                  raise RuntimeError(f'{repository}: expected {pin}, observed {observed}')
              return repository, observed

          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as executor:
              results = list(executor.map(checkout, repositories))
          print('bounded parallel exact full-history public checkouts:', sorted(results))
          PY

      - name: Measure object stores before proof
        env:
          METRIC_PHASE: before-proof
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          roots = sorted(path for path in Path('.deps').iterdir() if path.is_dir())
          rows = []
          for root in roots:
              git_dir = Path(subprocess.check_output(
                  ['git', '-C', str(root), 'rev-parse', '--path-format=absolute', '--git-dir'],
                  text=True,
              ).strip())
              object_dir = git_dir / 'objects'
              object_bytes = sum(
                  path.stat().st_size for path in object_dir.rglob('*') if path.is_file()
              )
              missing_output = subprocess.check_output(
                  ['git', '-C', str(root), 'rev-list', '--objects', '--all', '--missing=print'],
                  text=True,
              )
              rows.append({
                  'repo': root.name,
                  'head': subprocess.check_output(
                      ['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True
                  ).strip(),
                  'object_bytes': object_bytes,
                  'missing_promisor_objects': sum(
                      line.startswith('?') for line in missing_output.splitlines()
                  ),
                  'partial_clone_filter': subprocess.run(
                      ['git', '-C', str(root), 'config', '--get', 'remote.origin.partialclonefilter'],
                      text=True,
                      capture_output=True,
                      check=False,
                  ).stdout.strip() or None,
              })
          payload = {
              'schema_version': 'aoa-kag-hosted-checkout-metrics-v1',
              'mode': os.environ['CHECKOUT_MODE'],
              'phase': os.environ['METRIC_PHASE'],
              'repository_count': len(rows),
              'object_bytes': sum(row['object_bytes'] for row in rows),
              'missing_promisor_objects': sum(
                  row['missing_promisor_objects'] for row in rows
              ),
              'repositories': rows,
          }
          print('[aoa-kag-hosted-checkout-metrics] ' + json.dumps(payload, sort_keys=True))
          PY

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install PyYAML jsonschema jsonschema-rs==0.49.2

      - name: Run full release proof
        run: python scripts/ci_release_check.py

      - name: Check generated outputs are committed
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- generated)" ]; then
            git status --porcelain --untracked-files=all -- generated
            exit 1
          fi

      - name: Measure object stores after proof
        env:
          METRIC_PHASE: after-proof
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          roots = sorted(path for path in Path('.deps').iterdir() if path.is_dir())
