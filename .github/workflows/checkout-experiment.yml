              )
              missing_output = subprocess.check_output(
                  ['git', '-C', str(root), 'rev-list', '--objects', '--all', '--missing=print'],
                  text=True,
              )
              rows.append({
                  'repo': root.name,
                  'head': subprocess.check_output(
                      ['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True
                  ).strip(),
                  'object_bytes': object_bytes,
                  'missing_promisor_objects': sum(
                      line.startswith('?') for line in missing_output.splitlines()
                  ),
                  'partial_clone_filter': subprocess.run(
                      ['git', '-C', str(root), 'config', '--get', 'remote.origin.partialclonefilter'],
                      text=True,
                      capture_output=True,
                      check=False,
                  ).stdout.strip() or None,
              })
          payload = {
              'schema_version': 'aoa-kag-hosted-checkout-metrics-v1',
              'mode': os.environ['CHECKOUT_MODE'],
              'phase': os.environ['METRIC_PHASE'],
              'repository_count': len(rows),
              'object_bytes': sum(row['object_bytes'] for row in rows),
              'missing_promisor_objects': sum(
                  row['missing_promisor_objects'] for row in rows
              ),
              'repositories': rows,
          }
          print('[aoa-kag-hosted-checkout-metrics] ' + json.dumps(payload, sort_keys=True))
          PY
