name: Repo Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source_fast:
    name: Source Fast and Owner Family
    runs-on: ubuntu-latest
    outputs:
      impact-route: ${{ steps.impact.outputs.route }}
      impact-reason-ids: ${{ steps.impact.outputs.reason-ids }}
      full-audit-required: ${{ steps.impact.outputs.full-audit-required }}
    env:
      OS_ABYSS_ROOT: /srv/AbyssOS
      AOA_TECHNIQUES_ROOT: ${{ github.workspace }}/.deps/aoa-techniques
      AOA_PLAYBOOKS_ROOT: ${{ github.workspace }}/.deps/aoa-playbooks
      AOA_EVALS_ROOT: ${{ github.workspace }}/.deps/aoa-evals
      TREE_OF_SOPHIA_ROOT: ${{ github.workspace }}/.deps/Tree-of-Sophia
      AOA_MEMO_ROOT: ${{ github.workspace }}/.deps/aoa-memo
      AOA_AGENTS_ROOT: ${{ github.workspace }}/.deps/aoa-agents
      AOA_SDK_ROOT: ${{ github.workspace }}/.deps/aoa-sdk
      AOA_STATS_ROOT: ${{ github.workspace }}/.deps/aoa-stats
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Checkout Tree-of-Sophia
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/Tree-of-Sophia
          ref: d95a583272acb84dcb5b7e6896801f0364c7b234
          path: .deps/Tree-of-Sophia
          fetch-depth: 0

      - name: Checkout aoa-memo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-memo
          ref: bcda57fe47d5e3daaee8258cc4428dc6315ae239
          path: .deps/aoa-memo
          fetch-depth: 0

      - name: Checkout aoa-playbooks
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-playbooks
          ref: b72ca2d333bcdf516ed6656e34670fa93df88162
          path: .deps/aoa-playbooks
          fetch-depth: 0

      - name: Checkout aoa-evals
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-evals
          ref: 12b408727e40174dd10e1f9ad0fa2e7f7fd11eec
          path: .deps/aoa-evals
          fetch-depth: 0

      - name: Checkout aoa-agents
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-agents
          ref: 92dd79e6c79fef60faedf6b97f2c65ff89477d06
          path: .deps/aoa-agents
          fetch-depth: 0

      - name: Checkout aoa-techniques
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-techniques
          ref: 9a5222cc6a6b1fdc52b4df906f49dadfd0383c71
          path: .deps/aoa-techniques
          fetch-depth: 0

      - name: Checkout aoa-sdk
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-sdk
          ref: cbf225627f9f28d0470deb8a962ae12d1fe72375
          path: .deps/aoa-sdk
          fetch-depth: 0

      - name: Checkout aoa-stats
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-stats
          ref: 740c57d6ab2fe78d6a8440c19c2637431e039c6b
          path: .deps/aoa-stats
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install PyYAML jsonschema

      - name: Classify KAG validation impact
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python scripts/impact_routing.py classify
          --event-name "$EVENT_NAME"
          --base-ref "$BASE_SHA"
          --head-ref "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Check repo-local KAG index family
        uses: ./.github/actions/repo-local-kag-index

      - name: Run source-fast validation
        run: python scripts/ci_gate.py --mode source-fast

  release_audit:
    name: Full OS-wide Release Audit
    needs: source_fast
    if: >-
      always() &&
      needs.source_fast.result == 'success' &&
      needs.source_fast.outputs.full-audit-required == 'true'
    runs-on: ubuntu-latest
    env:
      AOA_TECHNIQUES_ROOT: ${{ github.workspace }}/.deps/aoa-techniques
      AOA_PLAYBOOKS_ROOT: ${{ github.workspace }}/.deps/aoa-playbooks
      AOA_EVALS_ROOT: ${{ github.workspace }}/.deps/aoa-evals
      TREE_OF_SOPHIA_ROOT: ${{ github.workspace }}/.deps/Tree-of-Sophia
      AOA_MEMO_ROOT: ${{ github.workspace }}/.deps/aoa-memo
      AOA_AGENTS_ROOT: ${{ github.workspace }}/.deps/aoa-agents
      AGENTS_OF_ABYSS_ROOT: ${{ github.workspace }}/.deps/Agents-of-Abyss
      EIGHT_DIONYSUS_ROOT: ${{ github.workspace }}/.deps/8Dionysus
      DIONYSUS_ROOT: ${{ github.workspace }}/.deps/Dionysus
      ATM10_AGENT_ROOT: ${{ github.workspace }}/.deps/ATM10-Agent
      AOA_SDK_ROOT: ${{ github.workspace }}/.deps/aoa-sdk
      AOA_SKILLS_ROOT: ${{ github.workspace }}/.deps/aoa-skills
      AOA_STATS_ROOT: ${{ github.workspace }}/.deps/aoa-stats
      ABYSS_STACK_ROOT: ${{ github.workspace }}/.deps/abyss-stack
      ABYSS_MACHINE_REPO_ROOT: ${{ github.workspace }}/.deps/abyss-machine
      AOA_SESSION_MEMORY_ROOT: ${{ github.workspace }}/.deps/aoa-session-memory
      AOA_4PDA_CONNECTOR_ROOT: ${{ github.workspace }}/.deps/aoa-4pda-connector
      AOA_COURSE_CONNECTOR_ROOT: ${{ github.workspace }}/.deps/aoa-course-connector
      AOA_DISCORD_CONNECTOR_ROOT: ${{ github.workspace }}/.deps/aoa-discord-connector
      AOA_STACKOVERFLOW_CONNECTOR_ROOT: ${{ github.workspace }}/.deps/aoa-stackoverflow-connector
      AOA_TELEGRAM_CONNECTOR_ROOT: ${{ github.workspace }}/.deps/aoa-telegram-connector
      AOA_XDA_CONNECTOR_ROOT: ${{ github.workspace }}/.deps/aoa-xda-connector
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Checkout Tree-of-Sophia
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/Tree-of-Sophia
          ref: d95a583272acb84dcb5b7e6896801f0364c7b234
          path: .deps/Tree-of-Sophia
          fetch-depth: 0

      - name: Checkout Agents-of-Abyss
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/Agents-of-Abyss
          ref: 66d86b04e685cf06b03a95a3f9c74e7c8d607740
          path: .deps/Agents-of-Abyss
          fetch-depth: 0

      - name: Checkout 8Dionysus
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/8Dionysus
          ref: aa67908a137a9c9631a439f266d32a8918c7213c
          path: .deps/8Dionysus
          fetch-depth: 0

      - name: Checkout Dionysus
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/Dionysus
          ref: 8529c00c731ce560c0d8d2719fabbaf9dcbe222e
          path: .deps/Dionysus
          fetch-depth: 0

      - name: Checkout ATM10-Agent
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/ATM10-Agent
          ref: f0108816981e81a5951ed0f74743982a46a8fad1
          path: .deps/ATM10-Agent
          fetch-depth: 0

      - name: Checkout aoa-memo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-memo
          ref: c7c83081b7db0a0e908f14888b7438b5ecdde3bf
          path: .deps/aoa-memo
          fetch-depth: 0

      - name: Checkout aoa-playbooks
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-playbooks
          ref: b72ca2d333bcdf516ed6656e34670fa93df88162
          path: .deps/aoa-playbooks
          fetch-depth: 0

      - name: Checkout aoa-evals
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-evals
          ref: 58bf49d374b008ef6625a9fd6893c61096777b4d
          path: .deps/aoa-evals
          fetch-depth: 0

      - name: Checkout aoa-agents
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-agents
          ref: 92dd79e6c79fef60faedf6b97f2c65ff89477d06
          path: .deps/aoa-agents
          fetch-depth: 0

      - name: Checkout aoa-techniques
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-techniques
          ref: 9a5222cc6a6b1fdc52b4df906f49dadfd0383c71
          path: .deps/aoa-techniques
          fetch-depth: 0

      - name: Checkout aoa-session-memory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-session-memory
          ref: b04c6101b66040b16edc5cdf39b2621aef20765c
          path: .deps/aoa-session-memory
          fetch-depth: 0
          ssh-key: ${{ secrets.AOA_SESSION_MEMORY_DEPLOY_KEY }}
          persist-credentials: false

      - name: Checkout aoa-sdk
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-sdk
          ref: cbf225627f9f28d0470deb8a962ae12d1fe72375
          path: .deps/aoa-sdk
          fetch-depth: 0

      - name: Checkout aoa-skills
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-skills
          ref: 5929ad000ff06750ced1c806766138dc11e54e5a
          path: .deps/aoa-skills
          fetch-depth: 0

      - name: Checkout aoa-stats
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-stats
          ref: 5627c41efe9f766a4b3437da857060847cb4f0f1
          path: .deps/aoa-stats
          fetch-depth: 0

      - name: Checkout abyss-stack
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/abyss-stack
          ref: 017210fa2b9b4ba10fe7c3c00ee8d3e63b926298
          path: .deps/abyss-stack
          fetch-depth: 0

      - name: Checkout abyss-machine
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/abyss-machine
          ref: a70b7f3a029c2dc4e86aa7446e4a058aa9e2e83e
          path: .deps/abyss-machine
          fetch-depth: 0

      - name: Checkout aoa-4pda-connector
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-4pda-connector
          ref: a273f71c6fcc30c34759b2ef1e2f08cd8fc6baa3
          path: .deps/aoa-4pda-connector
          fetch-depth: 0

      - name: Checkout aoa-course-connector
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-course-connector
          ref: 5a5219ef027df029313fc527c71a8764cfbd193e
          path: .deps/aoa-course-connector
          fetch-depth: 0

      - name: Checkout aoa-discord-connector
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-discord-connector
          ref: 2652b1d657cbe5a7888ac979cc07a8f9ec792887
          path: .deps/aoa-discord-connector
          fetch-depth: 0

      - name: Checkout aoa-stackoverflow-connector
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-stackoverflow-connector
          ref: a239551bd629f59d32b59649eb308245be99c903
          path: .deps/aoa-stackoverflow-connector
          fetch-depth: 0

      - name: Checkout aoa-telegram-connector
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-telegram-connector
          ref: 1d7e4157446839dc03f3ec80b687fdbb12dd8a22
          path: .deps/aoa-telegram-connector
          fetch-depth: 0

      - name: Checkout aoa-xda-connector
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/aoa-xda-connector
          ref: 45dc97667c104f17b71fcd13978de5172e5c4c8d
          path: .deps/aoa-xda-connector
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install PyYAML jsonschema

      - name: Run release audit
        run: python scripts/release_check.py

      - name: Check generated outputs are committed
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- generated)" ]; then
            git status --porcelain --untracked-files=all -- generated
            exit 1
          fi

  required_summary:
    name: Repo Validation
    needs:
      - source_fast
      - release_audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Enforce required landing result
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_FAST_RESULT: ${{ needs.source_fast.result }}
          FULL_AUDIT_RESULT: ${{ needs.release_audit.result }}
          FULL_AUDIT_REQUIRED: ${{ needs.source_fast.outputs.full-audit-required }}
        run: |
          python scripts/impact_routing.py summarize \
            --event-name "$EVENT_NAME" \
            --source-fast-result "$SOURCE_FAST_RESULT" \
            --full-audit-result "$FULL_AUDIT_RESULT" \
            --full-audit-required "$FULL_AUDIT_REQUIRED" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"
